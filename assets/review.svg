<text x="32" y="102" font-size="33" fill="#e7e6df" font-weight="700">Quer conhecer meu código?</text><text x="32" y="151" font-size="23" fill="#e6bc80" >Comece pelo Cdatra: Java, persistência e testes.</text><text x="32" y="190" font-size="23" fill="#9caa99" >A API, os exemplos e os limites estão documentados.</text><text x="32" y="246" font-size="23" fill="#a7d88b" >No Easy Hub, veja a aplicação completa:</text><text x="32" y="285" font-size="23" fill="#9caa99" >interface, servidor, impressão e versão desktop.</text><text x="32" y="340" font-size="23" fill="#e7e6df" >Gosto de entender o problema antes de escrever a solução.</text>
