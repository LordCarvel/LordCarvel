<title id="title">sobre.md</title><desc id="desc"># Olá, sou o Carvel Tenho foco em backend com Java e gosto de entender o caminho entre uma regra de negócio e o dado salvo.  Parte do meu código nasceu de necessidades do trabalho: pedidos, comandas, entregas e fechamento de caixa.  No Cdatra, estudo persistência por dentro: JDBC, reflexão, SQL e testes. Na web, uso React e Node.js.</desc>
