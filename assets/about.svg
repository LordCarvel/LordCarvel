<title id="title">sobre.md</title><desc id="desc"># Sou o Carvel. Meu foco é backend com Java. Gosto de construir ferramentas que resolvem problemas que eu conheço de perto.  Pedidos, impressão, entregas e caixa: foi com essas rotinas que vários dos meus projetos ganharam forma.  No Cdatra, aprofundo Java, persistência e testes. Nos apps, conecto interface, dados e uso no dia a dia.</desc>
